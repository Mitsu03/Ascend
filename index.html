<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0e13" />
    <meta
      name="description"
      content="Ascend — fitness e nutrição gamificados no universo do Bleach. Treina, cumpre as ordens da tua divisão e sobe de patente no Gotei 13."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      As fontes vêm de fora e a app usa-se no ginásio, muitas vezes sem rede.
      Uma folha de estilo é bloqueante: numa ligação que não responde (wifi de
      ginásio com portal, avião, cave) o primeiro render ficava à espera do
      tempo-limite da rede com o ecrã vazio. Com `media="print"` o browser
      descarrega-a sem bloquear e promove-a a `all` quando chegar; se nunca
      chegar, a app abre na fonte do sistema, que é a alternativa declarada em
      `--font-sans`. As fontes ainda deviam passar a ser servidas do próprio
      pacote — ver o relatório.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Ascend — Gotei 13</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
